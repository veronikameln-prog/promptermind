<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <!-- Галявина з роботами: білі напівпрозорі пагорби поверх градієнта блоку «Твій курс» -->
  <defs>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1a5e"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity=".25"/></filter>
  </defs>
  <!-- зорі й іскри -->
  <g fill="#fff">
    <path d="M90 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".7"/>
    <path d="M520 26l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".6"/>
    <circle cx="300" cy="22" r="2" opacity=".6"/><circle cx="410" cy="56" r="1.6" opacity=".5"/><circle cx="180" cy="70" r="1.6" opacity=".5"/><circle cx="600" cy="84" r="2" opacity=".5"/>
  </g>
  <!-- пагорби -->
  <path d="M0 150C90 110 170 118 250 140S420 170 500 128 610 110 640 118V240H0z" fill="#fff" opacity=".12"/>
  <path d="M0 176C110 140 200 150 300 170S470 196 560 160 630 150 640 154V240H0z" fill="#fff" opacity=".18"/>
  <path d="M0 206C120 182 230 190 330 204S520 222 640 196V240H0z" fill="#fff" opacity=".28"/>
  <!-- квіти -->
  <g>
    <circle cx="70" cy="208" r="4" fill="#fde68a"/><path d="M70 212v14" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="232" cy="200" r="4" fill="#fbcfe8"/><path d="M232 204v14" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="452" cy="212" r="4" fill="#fde68a"/><path d="M452 216v14" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="590" cy="198" r="4" fill="#c7d2fe"/><path d="M590 202v14" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
  </g>
  <!-- робот 1: махає -->
  <g transform="translate(130 104)" filter="url(#s)">
    <line x1="34" y1="0" x2="34" y2="12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="34" cy="-2" r="5" fill="#fde68a"/>
    <rect x="8" y="12" width="52" height="40" rx="16" fill="#fff"/>
    <rect x="15" y="20" width="38" height="22" rx="10" fill="url(#visor)"/>
    <circle cx="26" cy="31" r="4" fill="#7dd3fc"/><circle cx="42" cy="31" r="4" fill="#7dd3fc"/>
    <rect x="14" y="56" width="40" height="34" rx="12" fill="#ede9fe"/>
    <path d="M14 66c-12-6-16-20-12-30" stroke="#ede9fe" stroke-width="8" stroke-linecap="round"/>
    <rect x="18" y="88" width="10" height="12" rx="4" fill="#fff"/><rect x="40" y="88" width="10" height="12" rx="4" fill="#fff"/>
  </g>
  <!-- робот 2: великий, з ноутбуком -->
  <g transform="translate(286 84)" filter="url(#s)">
    <line x1="44" y1="0" x2="44" y2="14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="44" cy="-3" r="6" fill="#7dd3fc"/>
    <rect x="8" y="14" width="72" height="54" rx="22" fill="#fff"/>
    <rect x="17" y="24" width="54" height="32" rx="14" fill="url(#visor)"/>
    <path d="M30 40q4-6 8 0M50 40q4-6 8 0" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <rect x="16" y="72" width="56" height="46" rx="16" fill="#ede9fe"/>
    <rect x="22" y="92" width="44" height="28" rx="5" fill="#2a1a5e"/>
    <rect x="27" y="97" width="34" height="18" rx="3" fill="#a78bfa"/>
    <rect x="16" y="120" width="56" height="5" rx="2.5" fill="#fff"/>
  </g>
  <!-- робот 3: маленький, стрибає -->
  <g transform="translate(470 96)" filter="url(#s)">
    <line x1="26" y1="0" x2="26" y2="10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="26" cy="-2" r="4.5" fill="#fbcfe8"/>
    <circle cx="26" cy="30" r="22" fill="#fff"/>
    <rect x="11" y="20" width="30" height="18" rx="8" fill="url(#visor)"/>
    <circle cx="20" cy="29" r="3.5" fill="#7dd3fc"/><circle cx="32" cy="29" r="3.5" fill="#7dd3fc"/>
    <rect x="12" y="54" width="28" height="26" rx="10" fill="#ede9fe"/>
    <path d="M14 82l-6 10M38 82l6 10" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M470 186q26 10 52 0" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
  <!-- повітряна куля-повідомлення -->
  <g transform="translate(232 58)">
    <rect width="52" height="28" rx="12" fill="#fff" opacity=".9"/>
    <path d="M14 28l-4 10 12-10z" fill="#fff" opacity=".9"/>
    <circle cx="16" cy="14" r="3" fill="#6b2fff"/><circle cx="26" cy="14" r="3" fill="#6b2fff" opacity=".7"/><circle cx="36" cy="14" r="3" fill="#6b2fff" opacity=".4"/>
  </g>
</svg>
