# Новий сайт (гілка new-site): при кожному push GitHub Actions збирає CSS і деплоїть сайт
# в ОКРЕМИЙ проєкт Vercel «promptermind-new» як production — постійна публічна адреса,
# яку можна давати іншим людям. Основний сайт (гілка main → promptermind.vercel.app) не змінюється.
name: Deploy New Site (new-site)

on:
  push:
    branches: [new-site]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  NEW_PROJECT: promptermind-new

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Check required files
        run: |
          for f in index.html intensive.html css/tailwind.css custom-styles.css js/main.js; do
            test -s "$f" || { echo "Відсутній або порожній файл: $f"; exit 1; }
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create / link Vercel project
        run: |
          vercel project add "$NEW_PROJECT" --token=${{ secrets.VERCEL_TOKEN }} || echo "Проєкт уже існує"
          vercel link --yes --project "$NEW_PROJECT" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production of promptermind-new)
        run: |
          url=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployment: $url"
          echo "### Новий сайт: https://$NEW_PROJECT.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "Деплой: $url" >> "$GITHUB_STEP_SUMMARY"
