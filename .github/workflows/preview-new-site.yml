# Новий сайт (гілка new-site): при кожному push GitHub Actions збирає CSS і деплоїть PREVIEW-версію на Vercel.
# Без --prod, тож основний сайт (гілка main → promptermind.vercel.app) не змінюється.
# Посилання на preview з'являється у Summary запуску (вкладка Actions).
name: Preview Deploy (new-site)

on:
  push:
    branches: [new-site]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Check required files
        run: |
          for f in index.html intensive.html css/tailwind.css custom-styles.css js/main.js; do
            test -s "$f" || { echo "Відсутній або порожній файл: $f"; exit 1; }
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        run: |
          url=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "Preview: $url"
          echo "### Новий сайт (preview): $url" >> "$GITHUB_STEP_SUMMARY"
